<!DOCTYPE html>
<html lang="es">
<head>
 <meta charset="UTF-8">
 <title>Calculadora JSP</title>
</head>
<body>
 <h2>Calculadora Básica</h2>
 <form action="calculadora.jsp" method="GET">
 <label for="operando1">Operando 1:</label>
 <input type="number" id="operando1" name="operando1" required><br><br>
 <label for="operador">Operador:</label>
 <select id="operador" name="operador" required>
 <option value="+">+</option>
 <option value="-">-</option>
 <option value="*">*</option>
 <option value="/">/</option>
 </select><br><br>
 <label for="operando2">Operando 2:</label>
 <input type="number" id="operando2" name="operando2" required><br><br>
 <input type="submit" value="Calcular">
 </form>
 <h3 id="resultado"></h3>
</body>
</html>>
