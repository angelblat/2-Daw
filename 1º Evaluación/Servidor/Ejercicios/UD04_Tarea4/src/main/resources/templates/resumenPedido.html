<!DOCTYPE html>
<html lang="en" xmlns:th="http://thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Resumen del pedido</title>
</head>
<body>

<div th:object="${pedidoFinal}">
    <h2>Resumen de su pedido.</h2>
    <h4>Los datos son: ⬇️</h4>
    <ul>
        <li th:text="'Nombre: ' + *{nombre}"></li>
        <li th:text="'Dirección: ' + *{direccion}"></li>
        <li th:text="'Forma de pago: ' + *{formaPago}"></li>
        <li th:text="'Tamaño de Pizza: ' + *{size}"></li>
        <li th:text="'Extra queso: ' + *{extraQueso}"></li>
        <li th:text="'Ingredientes: ' + *{ingredientes}"></li>
        <li th:text="'Información adicional: ' + *{InstruccionesEspeciales}"></li>
    </ul>
</div>

<a th:href="@{/pedidopizza}">Volver a la página principal</a>

</body>
</html>
