<!DOCTYPE html>
<html lang="es" xmlns:th="http://thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pedido de Pizza</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f9f6f0;
            color: #333;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
        }

        .pizza-card {
            background: #ffffff;
            border-radius: 16px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.08);
            width: 100%;
            max-width: 450px;
            padding: 30px;
            box-sizing: border-box;
            border-top: 8px solid #e74c3c; /* Color rojo pizza */
        }

        h2 {
            margin-top: 0;
            color: #c0392b;
            text-align: center;
            font-size: 24px;
            margin-bottom: 25px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            font-weight: 600;
            margin-bottom: 8px;
            color: #4a4a4a;
            font-size: 14px;
        }

        input[type="text"],
        select,
        textarea {
            width: 100%;
            padding: 12px;
            border: 1px solid #ddd;
            border-radius: 8px;
            font-size: 15px;
            box-sizing: border-box;
            transition: all 0.3s ease;
            background-color: #fdfdfd;
        }

        input[type="text"]:focus,
        select:focus,
        textarea:focus {
            border-color: #e74c3c;
            outline: none;
            box-shadow: 0 0 0 3px rgba(231, 76, 60, 0.15);
        }

        .options-group {
            background-color: #fff9f5;
            padding: 15px;
            border-radius: 10px;
            border: 1px dashed #f5d6c6;
            margin-bottom: 20px;
        }

        .options-title {
            font-weight: 600;
            color: #d35400;
            margin-bottom: 10px;
            font-size: 14px;
        }

        .checkbox-container {
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin-bottom: 15px;
        }

        .checkbox-label {
            display: flex;
            align-items: center;
            gap: 8px;
            font-weight: normal;
            cursor: pointer;
            font-size: 15px;
        }

        .checkbox-label input {
            accent-color: #e74c3c;
            width: 18px;
            height: 18px;
            cursor: pointer;
        }

        textarea {
            height: 80px;
            font-family: inherit;
        }

        .button-group {
            display: flex;
            gap: 12px;
            margin-top: 25px;
        }

        button {
            flex: 1;
            padding: 14px;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        button[type="submit"] {
            background-color: #2ecc71;
            color: white;
        }

        button[type="submit"]:hover {
            background-color: #27ae60;
        }

        button[type="reset"] {
            background-color: #f1f2f6;
            color: #57606f;
        }

        button[type="reset"]:hover {
            background-color: #dfe4ea;
        }
    </style>
</head>
<body>

<form class="pizza-card" th:action="@{/pedidopizza/procesar}" th:object="${pedido}" method="post">
    <h2>🍕 Pedido de Pizza</h2>

    <div class="form-group">
        <label for="nombre">Nombre completo</label>
        <input type="text" th:field="*{nombre}" id="nombre" placeholder="Tu nombre">
    </div>

    <div class="form-group">
        <label for="direccion">Dirección de entrega</label>
        <input type="text" th:field="*{direccion}" id="direccion" placeholder="Calle, número, piso...">
    </div>

    <div class="options-group">
        <div class="options-title">Ingredientes</div>
        <div class="checkbox-container">
            <label class="checkbox-label"><input type="checkbox" th:field="*{ingredientes}" value="queso"> Queso</label>
            <label class="checkbox-label"><input type="checkbox" th:field="*{ingredientes}" value="tomate"> Tomate</label>
            <label class="checkbox-label"><input type="checkbox" th:field="*{ingredientes}" value="pepperoni"> Pepperoni</label>
        </div>

        <div class="options-title">Tamaño de la pizza</div>
        <div class="checkbox-container">

            <label class="checkbox-label"><input type="radio" th:field="*{size}" value="pequena"> Pequeña</label>
            <label class="checkbox-label"><input type="radio" th:field="*{size}" value="mediana" checked> Mediana</label>
            <label class="checkbox-label"><input type="radio" th:field="*{size}" value="grande"> Grande</label>
        </div>

        <div class="options-title">Extra de Queso</div>
        <div class="checkbox-container">

            <label class="checkbox-label"><input type="checkbox" th:field="*{extraQueso}" > Si.</label>
        </div>
    </div>

    <div class="form-group">
        <label for="formaPago">Forma de Pago</label>
        <select th:field="*{formaPago}" id="formaPago">
            <option value="efectivo">💵 Efectivo</option>
            <option value="tarjeta">💳 Tarjeta de Crédito/Débito</option>
        </select>
    </div>

    <div class="form-group">
        <label for="instrucciones">Instrucciones especiales</label>
        <textarea th:field="*{instruccionesEspeciales}" id="instrucciones" placeholder="Ej: El timbre no funciona, llamar al llegar..." style="resize: none"></textarea>
    </div>

    <div class="button-group">
        <button type="submit">Enviar Pedido</button>
        <button type="reset">Borrar</button>
    </div>
</form>

</body>
</html>
