<!DOCTYPE html>
<html lang="en" xmlns:th="http://thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Muestra los datos del alumno</title>
</head>
<body>

<div th:object="${alumnoEncontrado}">
    <h2>Se ha econtrado una persona con el DNI introducido.</h2>
    <h4>Los datos son: ⬇️</h4>
    <ul>
        <li th:text="'Nombre: ' + *{nombre}"></li>
        <li th:text="'Primer apellido: ' + *{primerApellido}"></li>
        <li th:text="'Segundo apellido: ' + *{segundoApellido}"></li>
        <li th:text="'Dni: ' + *{Dni}"></li>
    </ul>
</div>

<a th:href="@{/}">Volver a la página principal</a>

</body>
</html>
