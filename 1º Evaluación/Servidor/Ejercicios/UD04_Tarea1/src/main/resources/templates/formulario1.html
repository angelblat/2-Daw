<!DOCTYPE html>
<html lang="es" xmlns:th="http://thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Calculadora JSP</title>
</head>
<body>
<h2>Calculadora Básica</h2>

<form th:action="@{/calcular}" th:object="${operacion}" method="POST">

    <label for="operando1">Operando 1:</label>
    <input type="number" id="operando1" th:field="*{operando1}" required><br><br>

    <label for="operador">Operador:</label>
    <select id="operador" th:field="*{operador}" required>
        <option value="+">+</option>
        <option value="-">-</option>
        <option value="*">*</option>
        <option value="/">/</option>
    </select><br><br>

    <label for="operando2">Operando 2:</label>
    <input type="number" id="operando2" th:field="*{operando2}" required><br><br>

    <input type="submit" value="Calcular">
</form>

<h3 id="resultado"></h3>
</body>
</html>
