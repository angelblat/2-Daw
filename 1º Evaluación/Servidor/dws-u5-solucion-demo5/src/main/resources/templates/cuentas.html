<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Cuentas</title>
</head>
<body>
<div>
    <br>
    <h2 th:text="'Cuentas de ' + ${clienteDTO.nombre} + ' ' + ${clienteDTO.apellidos}"></h2>
    <p th:if="${listaCuentasDTO.isEmpty()}">No hay cuentas</p>
    <div th:if="${!listaCuentasDTO.isEmpty()}">
        <table border="1">
            <thead>
            <tr>
                <td>id</td>
                <td>Banco</td>
                <td>Sucursal</td>
                <td>DC</td>
                <td>Número de cuenta</td>
                <td>Saldo actual</td>
                <td>Movimientos</td>
                <td>Editar</td>
                <td>Eliminar</td>
            </tr>
            </thead>
            <tbody>
            <tr th:each="cuenta : ${listaCuentasDTO}">
                <td th:text="${cuenta.id}"></td>
                <td th:text="${cuenta.banco}"></td>
                <td th:text="${cuenta.sucursal}"></td>
                <td th:text="${cuenta.dc}"></td>
                <td th:text="${cuenta.numeroCuenta}"></td>
                <td th:text="${#numbers.formatDecimal(cuenta.saldoActual, 1, 'POINT', 2, 'COMMA')} + ' €'"></td>
                <td><a th:href="@{/clientes/{idCliente}/cuentas/{idCuenta}/movimientos(idCliente=${clienteDTO.id},idCuenta=${cuenta.id})}">Visualizar movimientos</a></td>
                <td><a th:href="@{/clientes/{idCliente}/cuentas/update/{idCuenta}(idCliente=${clienteDTO.id},idCuenta=${cuenta.id})}">Editar</a></td>
                <td><a th:href="@{/clientes/{idCliente}/cuentas/delete/{idCuenta}(idCliente=${clienteDTO.id},idCuenta=${cuenta.id})}">Eliminar</a></td>
            </tr>
            </tbody>
        </table>
    </div>
</div>
<br>
<div>
    <a th:href="@{/clientes/{idCliente}/cuentas/transferencia(idCliente=${clienteDTO.id})}">Crear transferencia</a> <br>
    <a th:href="@{/clientes/{idCliente}/cuentas/add(idCliente=${clienteDTO.id})}">Agregar cuenta</a> <br>
    <a th:href="@{/clientes}">Volver a clientes</a>
</div>
</body>
</html>
