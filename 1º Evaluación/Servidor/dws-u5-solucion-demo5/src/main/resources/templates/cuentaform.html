<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title th:text="${add} ? 'Nueva cuenta' : 'Actualizar cuenta'"></title>
</head>
<body>
<h1 th:text="${add} ? 'Nueva cuenta' : 'Actualizar cuenta'"></h1>
<p th:text="'Cliente: ' + ${clienteDTO.nombre} + ' ' + ${clienteDTO.apellidos}"></p>
<br>
<form th:action="@{/clientes/{idCliente}/cuentas/save(idCliente=${clienteDTO.id})}"
      th:object="${cuentaDTO}" method="POST">
    <table border="0">
        <tr th:if="${cuentaDTO.id}">
            <td>id</td>
            <td>:</td>
            <td><input type="text" th:field="*{id}" readonly /></td>
        </tr>
        <tr>
            <td>Banco</td>
            <td>:</td>
            <td><input type="text" th:field="*{banco}" /></td>
        </tr>
        <tr>
            <td>Sucursal</td>
            <td>:</td>
            <td><input type="text" th:field="*{sucursal}" /></td>
        </tr>
        <tr>
            <td>DC</td>
            <td>:</td>
            <td><input type="text" th:field="*{dc}" /></td>
        </tr>
        <tr>
            <td>Número de cuenta</td>
            <td>:</td>
            <td><input type="text" th:field="*{numeroCuenta}" /></td>
        </tr>
        <tr>
            <td>Saldo actual</td>
            <td>:</td>
            <td><input type="number" step="0.01" th:field="*{saldoActual}" /></td>
        </tr>
    </table>
    <input type="submit" th:value="${add} ? 'Nueva' : 'Actualizar'" />
</form>
<br>
<a th:href="@{/clientes/{idCliente}/cuentas(idCliente=${clienteDTO.id})}">Volver a las cuentas del cliente</a>
</body>
</html>
