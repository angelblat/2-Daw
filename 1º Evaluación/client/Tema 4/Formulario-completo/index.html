<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulario Elegante</title>
    <style>
        :root {
            --primary-color: #4f46e5;
            --primary-hover: #4338ca;
            --bg-color: #f3f4f6;
            --form-bg: #ffffff;
            --text-color: #1f2937;
            --border-color: #d1d5db;
            --focus-ring: rgba(79, 70, 229, 0.2);
        }

        body {
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
        }

        .form-container {
            background-color: var(--form-bg);
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
            width: 100%;
            max-width: 500px;
        }

        h2 {
            margin-top: 0;
            margin-bottom: 24px;
            font-size: 24px;
            text-align: center;
            color: var(--primary-color);
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 6px;
            font-weight: 600;
            font-size: 14px;
        }

        input[type="text"],
        textarea,
        select {
            width: 100%;
            padding: 10px 12px;
            border: 1px solid var(--border-color);
            border-radius: 6px;
            font-size: 15px;
            box-sizing: border-box;
            transition: all 0.2s ease;
            background-color: #fff;
        }

        input[type="text"]:focus,
        textarea:focus,
        select:focus {
            outline: none;
            border-color: var(--primary-color);
            box-shadow: 0 0 0 3px var(--focus-ring);
        }

        textarea {
            resize: vertical;
            min-height: 80px;
        }

        select[multiple] {
            height: auto;
            min-height: 100px;
        }

        /* Estilos para Radio y Checkbox */
        .option-group {
            display: flex;
            flex-direction: column;
            gap: 8px;
            margin-top: 4px;
        }

        .option-label {
            display: flex;
            align-items: center;
            font-weight: normal;
            cursor: pointer;
            font-size: 15px;
        }

        .option-label input {
            margin-right: 8px;
            width: 16px;
            height: 16px;
            accent-color: var(--primary-color); /* Cambia el color nativo del check/radio */
        }

        button {
            width: 100%;
            padding: 12px;
            background-color: var(--primary-color);
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: background-color 0.2s ease;
            margin-top: 10px;
        }

        button:hover {
            background-color: var(--primary-hover);
        }
        .error-message { color: red; font-size: 0.9em; margin-top: 5px; }
        .form-group { margin-bottom: 15px; }
    </style>
</head>
<body>
<div>
    <h2>Registro de Datos</h2>
    <form class="form-container" action="#" method="POST">

        <!-- 1. Input de texto -->
        <div class="form-group">
            <label for="nombre">Nombre completo</label>
            <input type="text" id="nombre" name="usuario_nombre" placeholder="Escribe tu nombre">
            <div id="error-nombre" class="error-message" hidden></div>
        </div>

        <!-- 2. Textarea -->
        <div class="form-group">
            <label for="comentarios">Comentarios o Mensaje</label>
            <textarea id="comentarios" name="usuario_comentarios" placeholder="Cuéntanos algo..."></textarea>
            <div id="error-comentarios" class="error-message" hidden></div>
        </div>

        <!-- 3. Radio buttons -->
        <div class="form-group">
            <label>¿Cómo nos conociste?</label>
            <div class="option-group">
                <label class="option-label">
                    <input type="radio" name="origen_descubrimiento" value="google"> Google
                </label>
                <label class="option-label">
                    <input type="radio" name="origen_descubrimiento" value="redes_sociales"> Redes Sociales
                </label>
                <label class="option-label">
                    <input type="radio" name="origen_descubrimiento" value="amigo"> Un amigo
                </label>
            </div>
            <div id="error-origen" class="error-message" hidden></div>
        </div>

        <!-- 4. Checkbox simple -->
        <div class="form-group">
            <label>Términos y condiciones</label>
            <div class="option-group">
                <label class="option-label">
                    <input type="checkbox" name="acepta_terminos" value="si"> Acepto la política de privacidad
                </label>
            </div>
            <div id="error-terminos" class="error-message" hidden></div>
        </div>

        <!-- 5. Checkbox múltiple -->
        <div class="form-group">
            <label>Intereses (Selecciona varios)</label>
            <div class="option-group">
                <label class="option-label">
                    <input type="checkbox" name="intereses" value="tecnologia"> Tecnología
                </label>
                <label class="option-label">
                    <input type="checkbox" name="intereses" value="diseno"> Diseño
                </label>
                <label class="option-label">
                    <input type="checkbox" name="intereses" value="marketing"> Marketing
                </label>
            </div>
            <div id="error-intereses" class="error-message" hidden></div>
        </div>

        <!-- 6. Select simple -->
        <div class="form-group">
            <label for="pais">País de residencia</label>
            <select id="pais" name="pais_residencia">
                <option value="" disabled selected>Selecciona un país</option>
                <option value="es">España</option>
                <option value="mx">México</option>
                <option value="ar">Argentina</option>
                <option value="co">Colombia</option>
            </select>
            <div id="error-pais" class="error-message" hidden></div>
        </div>

        <!-- 7. Select múltiple -->
        <div class="form-group">
            <label for="idiomas">Idiomas que hablas</label>
            <select id="idiomas" name="idiomas_hablados" multiple>
                <option value="espanol">Español</option>
                <option value="ingles">Inglés</option>
                <option value="frances">Francés</option>
                <option value="aleman">Alemán</option>
            </select>
            <div id="error-idiomas" class="error-message" hidden></div>
        </div>

        <button type="submit">Enviar formulario</button>
        <p id="mensaje"></p>
    </form>
</div>

<script>
    const formulario = document.querySelector('.form-container');
    let mensajeGeneral = document.getElementById("mensaje");

    formulario.addEventListener("submit", (e) => {
        e.preventDefault();

        const data = new FormData(formulario);
        let tieneErrores = false;

        // 1. Limpiamos todos los errores usando querySelectorAll (que sí permite usar forEach)
        const divsError = formulario.querySelectorAll('.error-message');

        divsError.forEach(div => {
            div.textContent = '';
            div.hidden = true;
        });
        mensajeGeneral.textContent = '';

        // 2. Función modificada: ahora recibe el ID exacto del div que queremos mostrar
        function setErrorMsg(idDelDiv, texto) {
            const divError = document.getElementById(idDelDiv);
            if (divError) {
                divError.textContent = texto;
                divError.hidden = false;
            }
            tieneErrores = true;
        }

        // 3. Validaciones pasando el ID del contenedor de error correspondiente
        const nombreVal = data.get('usuario_nombre');
        if (!nombreVal || nombreVal.trim() === '') {
            setErrorMsg('error-nombre', 'Debes introducir un nombre');
        }

        const usuarioComentariosVal = data.get('usuario_comentarios');
        if (!usuarioComentariosVal || usuarioComentariosVal.trim() === '') {
            setErrorMsg('error-comentarios', 'Debes comentar algo');
        }

        const origenDescubrimiento = data.get('origen_descubrimiento');
        if (!origenDescubrimiento) {
            setErrorMsg('error-origen', 'Debes marcar un origen');
        }

        const aceptaTerminos = data.get('acepta_terminos');
        if (!aceptaTerminos) {
            setErrorMsg('error-terminos', 'Debes aceptar los términos y condiciones');
        }

        const paisResidencia = data.get('pais_residencia');
        if (!paisResidencia) {
            setErrorMsg('error-pais', 'Debes marcar un país de residencia');
        }

        const idiomasHablados = data.getAll('idiomas_hablados');
        if (idiomasHablados.length === 0) {
            setErrorMsg('error-idiomas', 'Es obligatorio marcar al menos un idioma');
        }

        // 4. Si todo está correcto
        if (!tieneErrores) {
            mensajeGeneral.style.color = 'green';
            mensajeGeneral.textContent = '¡Formulario enviado con éxito!';
        }
    });
</script>
</body>
</html>
