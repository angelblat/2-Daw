<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Gestión de Biblioteca</title>
</head>
<style>
    body {
        font-family: sans-serif;
        padding: 20px;
    }
    form div, body > div {
        margin-bottom: 12px;
    }
    button {
        margin-top: 5px;
        margin-right: 5px;
        padding: 6px 12px;
    }
</style>
<body>

<h1>Gestión de Biblioteca</h1>

<form>
    <h2>Registrar Nuevo Libro</h2>

    <div>
        <label for="titulo">Título:</label>
        <input type="text" id="titulo" name="titulo">
    </div>

    <div>
        <label for="autor">Autor:</label>
        <input type="text" id="autor" name="autor">
    </div>

    <div>
        <label for="anio">Año:</label>
        <input type="text" id="anio" name="anio">
    </div>

    <div>
        <label for="genero">Género:</label>
        <input type="text" id="genero" name="genero">
    </div>

    <button id="btn-Agregar" type="button">Agregar a la Biblioteca</button>
    <button id="btn-Mostrar" type="button">Mostrar toda la Biblioteca</button>
</form>

<div>
    <label for="genero">Nombre del libro a borrar:</label>
    <input type="text" id="nombreBorrar" name="genero">
</div>

<button id="btn-Borrar" type="button">Borrar el libro de la biblioteca</button>
<br>
<button id="btn-CalcularMediaAnios" type="button">Calcular media de años de los libros de la biblioteca</button>

<p id="mediaAnios"></p>

<h2>Libros en la Biblioteca</h2>

<ul id="lista">

</ul>

<script src="index.js"></script>
</body>
</html>
