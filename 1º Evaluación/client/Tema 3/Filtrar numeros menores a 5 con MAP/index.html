<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Filtrar un array con método filter</title>
</head>
<body>

<script>
    const numeros = [1, 3, 8, 14, 49];
    const numerosMenores5 = numeros.filter(numero => numero < 5);

    console.log(numeros);
    console.log(numerosMenores5);
</script>

</body>
</html>
