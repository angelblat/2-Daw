    <title>Ejercicio 15: Búsqueda del primer elemento con find
    </title>

<body>

<script>
    const libros = [
        { titulo: "El Quijote", disponible: false },
        { titulo: "Cien años de soledad", disponible: true },
        { titulo: "1984", disponible: true }
    ];

    const libroCoincide = libros.find(libro => libro.disponible===true);
    console.log(libroCoincide)
</script>
