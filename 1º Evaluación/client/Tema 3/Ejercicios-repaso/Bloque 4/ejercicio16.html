<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Ejercicio 16: Extracción de propiedades con map
    </title>
</head>
<body>
<script>
    const alumnos = [
        { nombre: "Marcos", nota: 7.5 },
        { nombre: "Sara", nota: 9.0 },
        { nombre: "Javier", nota: 4.8 }
    ]

    const alumnosNombre = alumnos.map(alumno => alumno.nombre);

    console.log(alumnosNombre);
</script>
</body>
</html>
