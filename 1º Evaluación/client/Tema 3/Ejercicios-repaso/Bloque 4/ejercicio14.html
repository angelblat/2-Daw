<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Ejercicio 14: Recorrido de objetos con forEach
    </title>
</head>
<body>
<script>
    const productos = [
        { nombre: "Teclado", precio: 25 },
        { nombre: "Ratón", precio: 15 },
        { nombre: "Monitor", precio: 180 }
    ];

    productos.forEach(producto => console.log(`Nombre: ${producto.nombre}, Precio: ${producto.precio}`));
</script>
</body>
</html>
