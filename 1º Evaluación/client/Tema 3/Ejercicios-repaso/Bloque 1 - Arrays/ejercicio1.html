<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Acceso e índices en arrays</title>
</head>
<body>
<script>
    const dias = ["Lunes", "Martes", "Miércoles", "Jueves", "Viernes"];
    const primerElemento = dias[0];
    const ultimoElemento = dias[dias.length-1];
    const posicionMiercoles = dias.indexOf("Miércoles");

    console.log("El primer elemento es: "+primerElemento);
    console.log("El último elemento es: "+ultimoElemento);
    console.log(dias[posicionMiercoles].toUpperCase());
</script>
</body>
</html>
