<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Ejercicio 2: Manipulación con push, unshift y pop
    </title>
</head>
<body>
<script>
    const cola = ["Ana", "Carlos", "Elena"];
    console.log(cola);
    cola.push("David");
    console.log(cola);
    cola.unshift("Beatriz");
    console.log(cola);
    cola.pop()
    console.log(cola);
</script>
</body>
</html>
