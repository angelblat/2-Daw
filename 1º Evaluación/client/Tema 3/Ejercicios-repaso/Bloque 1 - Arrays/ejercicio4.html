<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Ejercicio 4: Extracción inmutable con slice
    </title>
</head>
<body>
<script>
    const numeros = [10, 20, 30, 40, 50, 60];

    const subArray = numeros.slice(1, numeros.length-1);

    console.log(numeros);
    console.log(subArray);
</script>
</body>
