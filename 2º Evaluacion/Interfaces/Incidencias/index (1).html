<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Registro de Incidencias · 2º DAW</title>
  <link rel="stylesheet" href="estilos.css">
  <script src="formulario.js" defer></script>
</head>
<body>
  <main class="contenedor">
    <h1>Registro de incidencias</h1>
    <p class="subtitulo">Comunica cualquier avería o fallo técnico en el centro.</p>

    <form id="form-incidencia">
      <div class="campo">
        <label for="nombre">Nombre y apellidos</label>
        <input type="text" id="nombre" name="nombre" required autocomplete="name" placeholder="Ej. Ana García López">
      </div>

      <div class="campo">
        <label for="email">Correo electrónico</label>
        <input type="email" id="email" name="email" required autocomplete="email" placeholder="nombre@centro.es">
      </div>

      <div class="campo">
        <label for="ubicacion">Ubicación / Aula</label>
        <select id="ubicacion" name="ubicacion" required>
          <option value="">Selecciona un espacio...</option>
          <option value="aula-informatica-1">Aula de Informática 1</option>
          <option value="aula-informatica-2">Aula de Informática 2</option>
          <option value="taller-redes">Taller de Redes</option>
          <option value="biblioteca">Biblioteca</option>
          <option value="secretaria">Secretaría</option>
        </select>
      </div>

      <fieldset class="campo">
        <legend>Tipo de incidencia</legend>
        <div class="opciones-grupo">
          <label><input type="radio" name="tipo" value="hardware" required> Hardware / Equipo</label>
          <label><input type="radio" name="tipo" value="software"> Software / Sistema</label>
          <label><input type="radio" name="tipo" value="red"> Red / Internet</label>
          <label><input type="radio" name="tipo" value="otro"> Otro</label>
        </div>
      </fieldset>

      <fieldset class="campo">
        <legend>Prioridad</legend>
        <div class="opciones-grupo">
          <label><input type="radio" name="prioridad" value="baja" required> Baja</label>
          <label><input type="radio" name="prioridad" value="media"> Media</label>
          <label><input type="radio" name="prioridad" value="alta"> Alta (impide dar clase)</label>
        </div>
      </fieldset>

      <div class="campo">
        <label for="fecha">Fecha de detección</label>
        <input type="date" id="fecha" name="fecha" required>
      </div>

      <div class="campo">
        <label for="descripcion">Descripción de la avería</label>
        <textarea id="descripcion" name="descripcion" rows="4" minlength="20" required placeholder="Detalla qué ocurre y en qué equipo o puesto..."></textarea>
      </div>

      <div class="acciones">
        <button type="submit" class="btn-primario">Enviar incidencia</button>
        <button type="reset" class="btn-secundario">Limpiar</button>
      </div>
    </form>
  </main>
</body>
</html>
